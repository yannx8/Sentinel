# Local stack: Postgres, Mailpit (SMTP with a web inbox), API and web app.
# Development: `docker compose up -d db mailpit`, then `pnpm dev`.
# Full stack:  `docker compose up --build`, then open http://localhost:8080
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: sentinel
      POSTGRES_USER: sentinel
      POSTGRES_PASSWORD: sentinel
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/db-init.sql:/docker-entrypoint-initdb.d/db-init.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U sentinel -d sentinel']
      interval: 5s
      timeout: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - '1025:1025'
      - '8025:8025'

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    image: sentinel-api:local
    environment:
      DATABASE_URL: postgresql://sentinel:sentinel@db:5432/sentinel
      NODE_ENV: production
      PORT: 4000
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:8080}
      TRUST_PROXY: 'true'
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      SMTP_FROM: 'Sentinel <no-reply@sentinel.local>'
      STORAGE_PATH: /app/uploads
    volumes:
      - uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_started

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    image: sentinel-web:local
    ports:
      - '8080:80'
    depends_on:
      - api

volumes:
  pgdata:
  uploads:
